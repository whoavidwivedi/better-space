name: Build Mac Desktop App (Tauri)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Next.js Static Export
        run: |
          rm -rf app/api
          BUILD_MODE=export NEXT_PUBLIC_API_URL=${{ secrets.VERCEL_PRODUCTION_URL }} bun run build

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SpaceX ${{ github.ref_name }}"
          releaseBody: "Automated release of SpaceX Native Apps."
          releaseDraft: false
          prerelease: false
