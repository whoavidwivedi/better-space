name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      secrets.RENDER_DEPLOY_HOOK != ''
    steps:
      - name: Get workflow result
        id: check
        run: |
          echo "CI passed and a Render deploy hook is configured — triggering deploy."

      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST \
            -o /dev/null \
            -w "Render deploy triggered (HTTP %{http_code})\n" \
            "${{ secrets.RENDER_DEPLOY_HOOK }}"