name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Get workflow result
        id: check
        run: |
          echo "CI passed — triggering deploy if Render deploy hook is configured."

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -fsS -X POST \
            -o /dev/null \
            -w "Render deploy triggered (HTTP %{http_code})\n" \
            "$RENDER_DEPLOY_HOOK"